<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHEPO IPTV — الإدارة</title>
<style>
:root{--bg:#08101d;--card:#111c31;--muted:#9ca8c7;--accent:#6d5dfc;--danger:#ef4444;--ok:#22c55e;--line:#263552}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(145deg,#08101d,#121c31);color:#fff}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:1350px;margin:auto;padding:22px}.hidden{display:none}.login{max-width:460px;margin:10vh auto;background:var(--card);padding:28px;border-radius:22px;box-shadow:0 20px 70px #0006}.brand{font-size:30px;font-weight:900}.sub{color:var(--muted);margin:7px 0 22px}.field{margin:10px 0}.field label{display:block;margin-bottom:6px;color:#dbe3ff}.field input,.field select,.field textarea{width:100%;padding:11px;border-radius:12px;border:1px solid #2a3a5f;background:#0b1425;color:#fff;outline:0}.btn{background:var(--accent);color:#fff;padding:10px 14px;border-radius:12px;font-weight:800}.btn.gray{background:#29354f}.btn.danger{background:var(--danger)}.btn.ok{background:#198754}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stat{background:var(--card);padding:17px;border-radius:16px;border:1px solid #1d2a44}.stat b{display:block;font-size:28px;margin-top:5px}.small{font-size:12px;color:var(--muted)}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.nav button{background:#1a2540;color:#dbe3ff;padding:10px 13px;border-radius:12px}.nav button.active{background:var(--accent);color:#fff}.panel{background:var(--card);padding:18px;border-radius:18px;margin:12px 0;border:1px solid #1d2a44}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}.oktext{color:#86efac}.bad{color:#fca5a5}.actions{display:flex;gap:6px;flex-wrap:wrap}pre{white-space:pre-wrap;word-break:break-all;background:#0a1322;padding:12px;border-radius:12px;color:#bfe1ff}textarea{min-height:150px}.success{background:#0d2a1a;border:1px solid #1b7042;padding:13px;border-radius:14px;margin-top:12px}.tag{display:inline-block;background:#203151;padding:4px 8px;border-radius:999px;font-size:12px}
</style>
</head>
<body><div class="wrap">
<section id="login" class="login">
<div class="brand">SHEPO IPTV</div>
<div class="sub">دخول آمن للمشرف لإدارة الأعضاء والقنوات والاشتراكات.</div>
<div class="field"><label>اسم المستخدم</label><input id="adminUsername" autocomplete="username" placeholder="اسم المشرف"></div>
<div class="field"><label>كلمة المرور</label><input id="adminPassword" type="password" autocomplete="current-password" placeholder="كلمة المرور"></div>
<button class="btn" onclick="adminLogin()">دخول إلى لوحة التحكم</button><div id="loginError" class="bad" style="margin-top:12px"></div>
</section>
<section id="app" class="hidden"><div class="top"><div><div class="brand">لوحة التحكم</div><div id="welcome" class="small"></div></div><div class="actions"><button class="btn" onclick="openCreateUser()">➕ إنشاء حساب Xtream</button><button class="btn gray" onclick="switchTab('streams')">📺 إدارة القنوات</button><button class="btn gray" onclick="switchTab('import')">⬆️ تغيير M3U</button><button class="btn ok" onclick="replaceWithBundledCatalog()">✨ تطبيق القائمة الجديدة</button><button class="btn gray" onclick="adminLogout()">خروج</button><a href="/" class="btn gray" style="text-decoration:none">صفحة المشاهدة</a></div></div>
<div class="grid" id="stats"></div>
<div class="nav"><button class="active" data-tab="users">Xtream والحسابات</button><button data-tab="subscriptions">الاشتراكات</button><button data-tab="pricing">الأسعار والإحصائيات</button><button data-tab="categories">التصنيفات</button><button data-tab="streams">القنوات</button><button data-tab="import">استيراد M3U</button><button data-tab="test">Xtream</button></div>
<div id="users" class="tab"></div><div id="subscriptions" class="tab hidden"></div><div id="pricing" class="tab hidden"></div><div id="categories" class="tab hidden"></div><div id="streams" class="tab hidden"></div><div id="import" class="tab hidden"></div><div id="test" class="tab hidden"></div>
</section></div>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||'حدث خطأ');return j}
async function boot(){try{const me=await api('/api/admin/me');$('#welcome').textContent='المشرف: '+me.username;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');loadAll();}catch{$('#login').classList.remove('hidden');$('#app').classList.add('hidden')}}
function switchTab(name){document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));$('#'+name).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name))}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
async function adminLogin(){const error=$('#loginError');error.textContent='جاري التحقق...';try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:$('#adminUsername').value.trim(),password:$('#adminPassword').value})});$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#welcome').textContent='المشرف: '+$('#adminUsername').value.trim();loadAll();}catch(e){error.textContent=e.message}}
async function adminLogout(){await api('/api/admin/logout',{method:'POST'});location.reload()}

async function loadAll(){
  await Promise.allSettled([stats(),categories(),streams(),importUI(),testUI(),subscriptions(),plansAdmin()]);
  await users();
}
function openCreateUser(){switchTab('users');const el=document.getElementById('uDisplay');if(el){el.focus();el.scrollIntoView({behavior:'smooth',block:'center'})}}
async function stats(){const s=await api('/api/stats');$('#stats').innerHTML=Object.entries({المستخدمون:s.users,النشطون:s.activeUsers,القنوات:s.live,الأفلام:s.movies,المسلسلات:s.series,التصنيفات:s.categories,طلبات_الاشتراك:s.pendingSubscriptions||0}).map(([k,v])=>`<div class="stat"><div class="small">${k}</div><b>${Number(v).toLocaleString('ar-EG')}</b></div>`).join('')}
function dateInputValue(d){if(!d)return '';const x=new Date(d);const pad=n=>String(n).padStart(2,'0');return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}T${pad(x.getHours())}:${pad(x.getMinutes())}`}
async function users(){
  const host=$('#users');
  host.innerHTML=`<div class="panel"><h2>➕ إنشاء حساب Xtream</h2><div class="row"><div class="field"><label>اسم العميل (اختياري)</label><input id="uDisplay" placeholder="مثال: أحمد"></div><div class="field"><label>Username</label><input id="uName" placeholder="ahmed123"></div><div class="field"><label>Password</label><input id="uPass" type="text" placeholder="6 أحرف على الأقل"></div><div class="field"><label>تاريخ الانتهاء</label><input id="uExp" type="datetime-local"></div><div class="field"><label>عدد الأجهزة</label><input id="uMax" type="number" min="1" value="1"></div></div><div class="field"><label>ملاحظات</label><input id="uNotes" placeholder="مثال: باقة شهرية"></div><div class="actions"><button class="btn" onclick="addUser()">إنشاء حساب Xtream</button><button class="btn gray" onclick="randomCreds()">توليد بيانات</button></div><div id="newCreds"></div></div><div id="usersList"></div>`;
  let rows=[];
  try{rows=await api('/api/users')}catch(e){$('#usersList').innerHTML=`<div class="panel" style="border-color:#ef4444"><b>التخزين غير مُعد على Vercel</b><div class="small" style="margin-top:6px">اربط Vercel Blob بالمشروع حتى يتم حفظ حسابات Xtream بشكل دائم على Vercel.</div></div>`;return}
  $('#usersList').innerHTML=`<div class="panel"><h2>👥 المستخدمون (${rows.length})</h2><div class="table-wrap"><table class="table"><tr><th>العميل</th><th>Username</th><th>الحالة</th><th>ينتهي</th><th>أجهزة</th><th>إجراءات</th></tr>${rows.map(u=>`<tr><td>${esc(u.displayName||'-')}<div class="small">${esc(u.notes||'')}</div></td><td>${esc(u.username)}</td><td>${u.enabled?'<span class="oktext">مفعل</span>':'<span class="bad">موقوف</span>'}${u.isTrial?' <span class="tag">تجريبي</span>':''}</td><td>${u.expiresAt?esc(new Date(u.expiresAt).toLocaleString('ar-EG')):'غير محدد'}</td><td>${u.maxConnections}</td><td class="actions"><button class="btn gray" onclick="toggleUser('${u.id}',${!u.enabled})">${u.enabled?'إيقاف':'تفعيل'}</button><button class="btn gray" onclick="editUser('${u.id}')">تعديل</button><button class="btn danger" onclick="delUser('${u.id}')">حذف</button></td></tr>`).join('')}</table></div></div>`
}
function randomCreds(){const letters='abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';const rnd=n=>Array.from({length:n},()=>letters[Math.floor(Math.random()*letters.length)]).join('');$('#uName').value='user'+rnd(6).toLowerCase();$('#uPass').value=rnd(10)}
async function addUser(){const box=$('#newCreds');try{const exp=$('#uExp').value?new Date($('#uExp').value).toISOString():null;const j=await api('/api/users',{method:'POST',body:JSON.stringify({displayName:$('#uDisplay').value,username:$('#uName').value,password:$('#uPass').value,notes:$('#uNotes').value,expiresAt:exp,maxConnections:Number($('#uMax').value||1)})});box.innerHTML=`<div class="success"><b>تم إنشاء المستخدم بنجاح</b><div>Username: <strong>${esc(j.credentials.username)}</strong> — Password: <strong>${esc(j.credentials.password)}</strong></div><div style="margin-top:8px">Server URL:</div><pre>${esc(j.credentials.serverUrl)}</pre><div>Xtream API:</div><pre>${esc(j.credentials.playerApiUrl)}</pre><button class="btn gray" onclick="navigator.clipboard.writeText(${JSON.stringify(j.credentials.playerApiUrl)});alert('تم نسخ Xtream API')">نسخ Xtream API</button><div style="margin-top:8px">رابط M3U:</div><pre>${esc(j.credentials.m3uUrl)}</pre><button class="btn" onclick="navigator.clipboard.writeText(${JSON.stringify(j.credentials.m3uUrl)});alert('تم النسخ')">نسخ M3U</button></div>`;await stats();}catch(e){box.innerHTML=`<div class="panel" style="border-color:#ef4444;color:#ffb2b9"><b>لم يتم إنشاء الحساب</b><div style="margin-top:6px">${esc(e.message)}</div></div>`}}
async function toggleUser(id,enabled){try{await api('/api/users/'+id,{method:'PATCH',body:JSON.stringify({enabled})});users();stats()}catch(e){alert(e.message)}}
async function editUser(id){const u=(await api('/api/users')).find(x=>x.id===id);if(!u)return;const displayName=prompt('اسم العميل:',u.displayName||'');if(displayName===null)return;const exp=prompt('تاريخ الانتهاء ISO أو اتركه فارغًا لإلغاء الانتهاء:',u.expiresAt||'');if(exp===null)return;const max=prompt('عدد الأجهزة:',String(u.maxConnections||1));if(max===null)return;const password=prompt('كلمة مرور جديدة (اتركها فارغة بدون تغيير):','');if(password===null)return;try{await api('/api/users/'+id,{method:'PATCH',body:JSON.stringify({displayName,expiresAt:exp?new Date(exp).toISOString():null,maxConnections:Number(max)||1,password})});users();}catch(e){alert(e.message)}}
async function delUser(id){if(confirm('حذف المستخدم نهائيًا؟')){await api('/api/users/'+id,{method:'DELETE'});users();stats()}}
async function plansAdmin(){const host=$('#pricing');try{const data=await api('/api/admin/plans');host.innerHTML=`<div class="panel"><h2>الأسعار والإحصائيات</h2><p class="small">عدّل الأسعار من هنا؛ الأسعار المعروضة في الصفحة الأولى تُقرأ من نفس الإعدادات.</p><div class="row">${data.plans.map(p=>`<div class="panel"><h3>${esc(p.name)}</h3><div class="field"><label>السعر الحالي</label><input id="price-${esc(p.code)}" type="number" min="0" value="${Number(p.price)}"></div><div class="field"><label>السعر السابق (اختياري)</label><input id="old-${esc(p.code)}" type="number" min="0" value="${p.originalPrice==null?'':Number(p.originalPrice)}"></div><button class="btn ok" onclick="savePlan('${esc(p.code)}')">حفظ السعر</button></div>`).join('')}</div></div><div class="panel"><h2>ملخص الكتالوج</h2><p class="small">عدد القنوات الحالية يظهر أيضًا في بطاقات الإحصائيات بالأعلى: القنوات، التصنيفات، والأعضاء النشطون.</p></div>`}catch(e){host.innerHTML=`<div class="panel"><b>${esc(e.message)}</b></div>`}}
async function savePlan(code){try{await api('/api/admin/plans/'+encodeURIComponent(code),{method:'PATCH',body:JSON.stringify({price:Number($('#price-'+code).value),originalPrice:$('#old-'+code).value})});alert('تم حفظ السعر');plansAdmin()}catch(e){alert(e.message)}}
async function categories(){const rows=await api('/api/categories');$('#categories').innerHTML=`<div class="panel"><h2>إضافة تصنيف</h2><div class="row"><div class="field"><label>الاسم</label><input id="cName"></div><div class="field"><label>النوع</label><select id="cType"><option value="live">Live</option><option value="vod">Movies</option><option value="series">Series</option></select></div></div><button class="btn" onclick="addCat()">إضافة</button></div><div class="panel"><table class="table"><tr><th>الاسم</th><th>النوع</th><th></th></tr>${rows.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.type)}</td><td><button class="btn danger" onclick="delCat('${c.id}')">حذف</button></td></tr>`).join('')}</table></div>`}
async function addCat(){await api('/api/categories',{method:'POST',body:JSON.stringify({name:$('#cName').value,type:$('#cType').value})});categories();stats()}
async function delCat(id){if(confirm('حذف التصنيف؟')){await api('/api/categories/'+id,{method:'DELETE'});categories();stats()}}
async function streams(){const rows=await api('/api/streams');$('#streams').innerHTML=`<div class="panel"><h2>📺 إدارة القنوات (${rows.length.toLocaleString('ar-EG')})</h2><p class="small">أضف قناة يدويًا أو احذف أي قناة. لتغيير القائمة بالكامل استخدم تبويب تغيير M3U.</p><div class="row"><div class="field"><label>اسم القناة</label><input id="sName" placeholder="مثال: Sports Channel"></div><div class="field"><label>رابط البث</label><input id="sUrl" placeholder="https://example.com/live.m3u8"></div><div class="field"><label>رابط الشعار (اختياري)</label><input id="sLogo" placeholder="https://.../logo.png"></div></div><div class="actions"><button class="btn" onclick="addStream()">➕ إضافة القناة</button><button class="btn" onclick="replaceWithBundledCatalog()">✨ تطبيق القائمة الجديدة</button><button class="btn gray" onclick="syncBundledCatalog()">🔄 مزامنة القنوات المرفقة</button><button class="btn danger" onclick="deleteAllStreams()">🗑️ حذف كل القنوات</button></div></div><div class="panel"><div class="table-wrap"><table class="table"><tr><th>القناة</th><th>الرابط</th><th></th></tr>${rows.slice(0,500).map(s=>`<tr><td>${esc(s.name)}</td><td><span class="small">${esc(s.url)}</span></td><td><button class="btn danger" onclick="delStream('${s.id}')">حذف</button></td></tr>`).join('')}</table></div></div>`} 
async function addStream(){try{const name=$('#sName').value.trim(),url=$('#sUrl').value.trim();if(!name||!url)return alert('اكتب اسم القناة ورابط البث');await api('/api/streams',{method:'POST',body:JSON.stringify({name,url,logo:$('#sLogo').value.trim(),containerExtension:/\.m3u8/i.test(url)?'m3u8':'ts'})});streams();stats();}catch(e){alert(e.message)}}
async function deleteAllStreams(){if(confirm('سيتم حذف كل القنوات المباشرة والتصنيفات الخاصة بها. هل أنت متأكد؟')){await api('/api/streams',{method:'DELETE'});streams();categories();stats()}}
async function syncBundledCatalog(){try{const j=await api('/api/sync-bundled-catalog',{method:'POST'});alert('تمت مزامنة '+j.added+' قناة جديدة. الإجمالي: '+j.total);streams();categories();stats()}catch(e){alert(e.message)}}
async function replaceWithBundledCatalog(){if(!confirm('سيتم حذف القنوات الحالية من Blob ووضع القائمة الجديدة فقط. الحسابات لا تتأثر. هل أنت متأكد؟'))return;try{const j=await api('/api/replace-with-bundled-catalog',{method:'POST'});alert('تم تطبيق القائمة الجديدة: '+j.total+' قناة');streams();categories();stats()}catch(e){alert(e.message)}}
async function delStream(id){if(confirm('حذف القناة؟')){await api('/api/streams/'+id,{method:'DELETE'});streams();stats()}}
async function importUI(){$('#import').innerHTML=`<div class="panel import-panel"><div class="section-kicker">مصدر القنوات</div><h2>استيراد M3U بدون نتيجة صفر</h2><p class="small">الصق محتوى M3U أو ضع رابط القائمة المباشر. يجب أن يكون المصدر مصرحًا لك باستخدامه.</p><div class="field"><label>رابط ملف M3U المباشر (اختياري)</label><input id="m3uUrl" dir="ltr" placeholder="https://example.com/channels.m3u"></div><div class="import-divider"><span>أو الصق المحتوى</span></div><textarea id="m3u" dir="ltr" placeholder="#EXTM3U\n#EXTINF:-1,Channel\nhttps://example.com/stream"></textarea><div class="actions"><button class="btn" onclick="importM3U(false)">➕ إضافة القنوات</button><button class="btn danger" onclick="importM3U(true)">استبدال كل القنوات</button></div><pre id="importResult"></pre></div>`}
async function importM3U(replace=false){try{const content=$('#m3u').value.trim(),url=$('#m3uUrl').value.trim();if(!content&&!url)return $('#importResult').textContent='ضع رابط M3U أو الصق محتوى القائمة أولًا';if(replace&&!confirm('سيتم استبدال كل القنوات الحالية بالقائمة الجديدة. هل أنت متأكد؟'))return;$('#importResult').textContent='جاري تحميل وتحليل القائمة...';const j=await api('/api/import-m3u',{method:'POST',body:JSON.stringify({content:content||undefined,url:url||undefined,replace})});$('#importResult').textContent=(replace?'تم استبدال القائمة بـ ':'تمت إضافة ')+j.imported+' قناة بنجاح';streams();categories();stats()}catch(e){$('#importResult').textContent='فشل الاستيراد: '+e.message}}

async function subscriptions(){const host=$('#subscriptions');try{const rows=await api('/api/subscriptions');host.innerHTML=`<div class="panel"><h2>طلبات الاشتراك</h2><p class="small">طلبات الأعضاء من باقة 50 الشهرية أو 300 السنوية. بعد التحقق اليدوي فعّل الطلب ليُمدّد الحساب تلقائيًا.</p><div class="table-wrap"><table class="table"><tr><th>المستخدم</th><th>الباقة</th><th>المبلغ</th><th>الحالة</th><th>التاريخ</th><th>إجراء</th></tr>${rows.length?rows.map(r=>`<tr><td>${esc(r.username)}</td><td>${esc(r.planName)}</td><td>${Number(r.amount).toLocaleString('ar-EG')}</td><td>${r.status==='active'?'<span class="oktext">مفعل</span>':r.status==='rejected'?'<span class="bad">مرفوض</span>':'<span class="tag">قيد المراجعة</span>'}</td><td>${esc(new Date(r.requestedAt).toLocaleString('ar-EG'))}</td><td class="actions">${r.status==='pending'?`<button class="btn ok" onclick="setSubscription('${r.id}','active')">تفعيل</button><button class="btn danger" onclick="setSubscription('${r.id}','rejected')">رفض</button>`:'—'}</td></tr>`).join(''):'<tr><td colspan="6" class="small">لا توجد طلبات حتى الآن.</td></tr>'}</table></div></div>`}catch(e){host.innerHTML=`<div class="panel"><b>${esc(e.message)}</b></div>`}}
async function setSubscription(id,status){try{await api('/api/subscriptions/'+id,{method:'PATCH',body:JSON.stringify({status})});subscriptions();stats();users();}catch(e){alert(e.message)}}
async function testUI(){const base=location.origin;$('#test').innerHTML=`<div class="panel"><h2>حسابات Xtream</h2><p>Server URL:</p><pre>${esc(base)}</pre><p>بعد إنشاء مستخدم، استخدم:</p><pre>${esc(base)}/player_api.php?username=USERNAME&password=PASSWORD</pre><p>وقائمة M3U:</p><pre>${esc(base)}/get.php?username=USERNAME&password=PASSWORD&type=m3u_plus</pre></div>`}
boot();
</script></body></html>
